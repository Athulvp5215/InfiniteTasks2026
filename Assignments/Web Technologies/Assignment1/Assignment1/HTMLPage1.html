<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Example</title>
</head>
<body>

    <!-- 1. Largest heading -->
    <h1>Welcome</h1>

    <!-- 2. Second highest heading -->
    <h2>About Us</h2>

    <!-- 3. Third highest heading centered -->
    <h3 style="text-align: center;">Welcome To HTML</h3>

    <!-- 4. Heading with specific text color -->
    <h3 style="color: #0066cc;">Services</h3>

    <!-- 5. Underlined heading with red color -->
    <h3 style="color: #ff0000; text-decoration: underline;">Important</h3>

    <!-- 6. Text input for user's name -->
    <input type="text" placeholder="Enter your name">

    <br><br>

    <!-- 7. Password input with placeholder -->
    <input type="password" placeholder="Enter your password">

    <br><br>

    <!-- 8. Checkbox with label -->
    <input type="checkbox" id="agree">
    <label for="agree">I Agree</label>

    <br><br>

    <!-- 9. Audio with controls -->
    <audio controls>
        <source src="SampleAudio.mp3" type="audio/mpeg">
    </audio>

    <br><br>

    <!-- 10. Unordered list -->
    <ul>
        <li>Red</li>
        <li>Blue</li>
    </ul>

</body>
</html>
