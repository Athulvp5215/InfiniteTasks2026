<html>
<head>
    <title>Input Change</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
    $(document).ready(function(){
        $("input").change(function(){
            $("body").append("<p>Input value changed</p>");
        });
    });
    </script>

</head>
<body>

    <input type="text">

</body>
</html>
